name: Build & Publish

# Thin caller: all versioning/build/publish logic lives in
# openg2p/openg2p-packaging@v1. This file declares only what THIS repo contains.

on:
  push:
    branches: ["**"]
    tags: ["**"]
  workflow_dispatch:
    inputs:
      changelog_skip_ai:
        description: 'Skip the AI summary — publish the changelog from commit messages only (use when AI is unavailable). Leave OFF for a normal run.'
        type: boolean
        default: false
      changelog_regenerate:
        description: 'Backfill the AI summary for a release that published without one: enter its release version e.g. 1.0.1 (a bare N.N.N, not a develop version). Leave EMPTY for a normal run.'
        type: string
        default: ''

jobs:
  build-publish:
    uses: openg2p/openg2p-packaging/.github/workflows/build-publish.yml@v1
    with:
      changelog_skip_ai: ${{ inputs.changelog_skip_ai || false }}
      changelog_regenerate: ${{ inputs.changelog_regenerate || '' }}

      # Images go to Docker Hub under the default openg2p namespace, so the paths
      # are openg2p/<name>. `pins` are per-image: only the api Dockerfile declares
      # ARG FASTAPI_COMMON_REF, and `develop` is a BRANCH -- without resolving it
      # to a SHA, two builds of the same commit produce different images.
      images: |
        [
          {"name": "consent-manager-api",
           "dockerfile": "docker/consent-manager-api/Dockerfile",
           "pins": [
             {"arg": "FASTAPI_COMMON_REF",
              "repo": "https://github.com/openg2p/openg2p-fastapi-common",
              "ref": "develop"}
           ]},

          {"name": "consent-manager-sanity",
           "dockerfile": "docker/consent-manager-sanity/Dockerfile"},

          {"name": "consent-manager-ui",
           "dockerfile": "ui/Dockerfile",
           "context": "ui"},

          {"name": "consent-manager-partner-portal",
           "dockerfile": "partner-portal/Dockerfile",
           "context": "partner-portal"}
        ]

      chart-path: deployment/charts/openg2p-consent-manager

      # Every OpenG2P image the chart deploys. jbergknoff/postgresql-client is
      # third-party and stays pinned in values.yaml.
      chart-image-paths: |
        [".ui.image.tag",
         ".partnerPortal.image.tag",
         ".consentManagerApi.image.tag",
         ".sanity.image.tag"]

      packaging-ref: v1

    secrets:
      docker_hub_actor: ${{ secrets.docker_hub_actor }}
      docker_hub_token: ${{ secrets.docker_hub_token }}
      OPENG2P_BOT_GITHUB_PAT: ${{ secrets.OPENG2P_BOT_GITHUB_PAT }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
