[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "openg2p-consent-manager"
authors = [
  { name = "OpenG2P", email = "info@openg2p.org" },
]
description = "OpenG2P Consent Manager — verifies partner-signed consent objects and governs outbound data sharing."
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: Mozilla Public License 2.0 (MPL 2.0)",
  "Operating System :: OS Independent",
]
dependencies = [
  "openg2p-fastapi-common >=1.1.4",
  "asyncpg",
  # SQLAlchemy 2.1 made greenlet optional, so an unpinned resolve pulled 2.1
  # without it and the API died at import ("requires the greenlet library").
  # [asyncio] brings greenlet; <2.1 keeps us on the tested line (as in MDS and
  # the registry platform).
  "sqlalchemy[asyncio] >=2.0,<2.1",
  # Prebuilt wheel — avoids needing C headers/libpq-dev to compile from source.
  # The app uses the async asyncpg driver; this is only the sync fallback.
  "psycopg2-binary",
  "cryptography >=42.0.0",
  "pyjwt >=2.8.0",
  "httpx",
  # Consent evidence in S3-compatible object storage (Garage), as in the
  # master data service. Sync client; calls run in a worker thread.
  "boto3",
]
dynamic = ["version"]

[project.optional-dependencies]
test = ["pytest>=8", "httpx>=0.27", "moto[s3]>=5"]

[project.urls]
Homepage = "https://openg2p.org"
Documentation = "https://docs.openg2p.org/"
Repository = "https://github.com/openg2p/consent-manager"

[tool.hatch.version]
path = "src/openg2p_consent_manager/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/openg2p_consent_manager"]

[tool.pytest.ini_options]
testpaths = ["tests"]
