{{- /*
Generated passwords for partnerPortal.testUsers (testing only): key =
username. Existing values are kept on upgrade (lookup), and the Secret
survives uninstall, so the users' passwords stay valid. The users themselves
are created by hand in the partner realm (keycloak-init cannot set the
partner_id attribute) — see values.yaml above partner-keycloak-init.
*/ -}}
{{- if and .Values.partnerPortal.enabled .Values.partnerPortal.testUsers }}
{{- $name := tpl .Values.partnerPortal.testUsersSecretName . }}
{{- $existing := (lookup "v1" "Secret" .Release.Namespace $name) | default dict }}
{{- $data := $existing.data | default dict }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels: {{- include "common.labels.standard" (dict "customLabels" .Values.commonLabels "context" .) | nindent 4 }}
  annotations:
    "helm.sh/resource-policy": keep
    # Who each user is (partner_id + roles) — for the person creating them.
    openg2p.org/partner-test-users: {{ toJson .Values.partnerPortal.testUsers | quote }}
type: Opaque
data:
  {{- range .Values.partnerPortal.testUsers }}
  {{ .username | quote }}: {{ index $data .username | default (randAlphaNum 16 | b64enc) }}
  {{- end }}
{{- end }}
