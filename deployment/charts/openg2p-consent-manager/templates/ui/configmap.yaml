{{- if .Values.ui.enabled }}
{{- $values := .Values.ui -}}
{{- $context := dict "Values" (merge (deepCopy $values) (dict "global" .Values.global)) "Chart" .Chart "Release" .Release "Files" .Files "Capabilities" .Capabilities -}}
{{- with $context -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "common.names.fullname" . }}-config
  labels: {{- include "common.labels.standard" (dict "customLabels" .Values.commonLabels "context" $) | nindent 4 }}
data:
  # Runtime config read by the SPA at boot (ui/src/auth.ts → loadConfig).
  # Mounted into nginx at /usr/share/nginx/html/config.json. apiBaseUrl is empty
  # (same-origin): the shared VirtualService routes /consent/ to the staff API.
  config.json: |
    {
      "apiBaseUrl": "",
      "keycloak": {
        "url":      {{ tpl .Values.global.keycloakBaseUrl $ | quote }},
        "realm":    {{ tpl .Values.global.keycloakRealm $ | quote }},
        "clientId": {{ .Values.clientId | quote }}
      },
      "adminRole":    {{ tpl .Values.global.consentManagerAdminRole $ | quote }},
      "approverRole": {{ tpl .Values.global.consentManagerApproverRole $ | quote }}
      {{- if include "consentManager.beneAuthOn" $ }},
      "beneficiaryAuth": { "enabled": true }
      {{- end }}
      {{- if include "consentManager.consentLoginOn" $ }},
      "consentLogin": { "enabled": true }
      {{- end }}
    }
{{- end -}}
{{- end }}
